<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient Deep Obsidian Luxury -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="45%" stop-color="#0b1329"/>
      <stop offset="85%" stop-color="#062226"/>
      <stop offset="100%" stop-color="#03161a"/>
    </linearGradient>

    <!-- Emerald Teal Aurora Gradient (Excellence & Growth) -->
    <linearGradient id="emeraldAurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Cyan Electric Beam Gradient (Technology & AI) -->
    <linearGradient id="cyanBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Royal Sahara Gold Gradient (Faith & Spiritual Radiance) -->
    <linearGradient id="goldRadiance" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Metallic Platinum Border -->
    <linearGradient id="platinumBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="50%" stop-color="rgba(16,185,129,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="auroraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Luxury Obsidian Rounded Squircle -->
  <rect width="512" height="512" rx="136" fill="url(#bgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="133" fill="none" stroke="url(#platinumBorder)" stroke-width="2.5"/>

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="170" cy="190" r="140" fill="#10b981" opacity="0.12" filter="url(#auroraGlow)"/>
  <circle cx="350" cy="300" r="130" fill="#06b6d4" opacity="0.10" filter="url(#auroraGlow)"/>
  <circle cx="340" cy="150" r="90" fill="#f59e0b" opacity="0.12" filter="url(#auroraGlow)"/>

  <!-- Geometric Decorative Grid / Diamond Accents -->
  <path d="M 256 36 L 260 48 L 272 52 L 260 56 L 256 68 L 252 56 L 240 52 L 252 48 Z" fill="#6ee7b7" opacity="0.7"/>
  <circle cx="90" cy="256" r="3" fill="#38bdf8" opacity="0.4"/>
  <circle cx="422" cy="256" r="3" fill="#fbbf24" opacity="0.4"/>

  <!-- Main Luxury Monogram "M" & "B" (Dual Partner Wings & Open Book of Knowledge) -->
  <g filter="url(#softShadow)">
    
    <!-- Left Wing / Academic Book Page (Elevation & Study) -->
    <path d="M 130 336 
             C 170 320, 224 322, 246 342 
             L 246 196 
             C 220 178, 166 178, 130 194 
             Z" 
          fill="url(#emeraldAurora)"/>

    <!-- Left Wing Specular Reflection -->
    <path d="M 138 200 
             C 170 186, 216 186, 238 200 
             L 238 208 
             C 216 194, 170 194, 138 208 
             Z" 
          fill="#ffffff" opacity="0.35"/>

    <!-- Right Wing / Digital Innovation & AI (Growth & Synergy) -->
    <path d="M 382 336 
             C 342 320, 288 322, 266 342 
             L 266 196 
             C 292 178, 346 178, 382 194 
             Z" 
          fill="url(#cyanBeam)"/>

    <!-- Right Wing Specular Reflection -->
    <path d="M 374 200 
             C 342 186, 296 186, 274 200 
             L 274 208 
             C 296 194, 342 194, 374 208 
             Z" 
          fill="#ffffff" opacity="0.35"/>

    <!-- Central Knowledge Spine (Gilded Bronze) -->
    <path d="M 252 192 L 260 192 L 260 348 L 252 348 Z" fill="#fde68a" opacity="0.85" rx="3"/>

    <!-- Floating Crescent Moon & Guiding Star of Wisdom (Faith & Peace) -->
    <!-- Crescent Moon -->
    <path d="M 342 108 
             A 38 38 0 1 1 292 168 
             A 30 30 0 1 0 342 108 Z" 
          fill="url(#goldRadiance)"/>

    <!-- Guiding 8-Pointed Star -->
    <path d="M 358 126 
             L 362 135 L 371 136 L 364 142 L 366 151 L 358 146 L 350 151 L 352 142 L 345 136 L 354 135 Z" 
          fill="url(#goldRadiance)"/>

    <!-- Dynamic AI Sparkle on Left (Innovation Brilliance) -->
    <path d="M 166 122 Q 166 142 148 146 Q 166 150 166 170 Q 166 150 184 146 Q 166 142 166 122 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="196" cy="126" r="3.5" fill="#6ee7b7" opacity="0.8"/>

    <!-- Partnership Arch (The "Binôme" Connection Loop) -->
    <path d="M 194 374 C 230 398, 282 398, 318 374" 
          fill="none" 
          stroke="url(#emeraldAurora)" 
          stroke-width="7" 
          stroke-linecap="round"/>

    <!-- Milestone Achievement Diamond Seal -->
    <circle cx="256" cy="386" r="16" fill="#10b981" stroke="#050811" stroke-width="4"/>
    <path d="M 250 386 L 254 390 L 263 381" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
