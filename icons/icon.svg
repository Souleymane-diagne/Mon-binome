<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Radial Glow Aura -->
  <circle cx="256" cy="230" r="150" fill="#10b981" opacity="0.12"/>
  <circle cx="340" cy="160" r="100" fill="#06b6d4" opacity="0.10"/>

  <g filter="url(#glow)">
    <!-- Dual Linked Emblem: The "Binôme" (Partnership & Excellence) -->
    <!-- Left Wing (Study & Courses) -->
    <path d="M 160 320 C 190 310, 240 310, 256 330 C 272 310, 322 310, 352 320 L 352 210 C 322 200, 272 200, 256 220 C 240 200, 190 200, 160 210 Z" fill="url(#primaryGrad)"/>
    <path d="M 256 220 L 256 330" stroke="#042f2e" stroke-width="4" stroke-linecap="round"/>

    <!-- Crescent Moon (Prayer & Faith) -->
    <path d="M 335 115 A 42 42 0 1 1 275 175 A 34 34 0 1 0 335 115 Z" fill="url(#goldGrad)"/>
    <polygon points="348,138 351,145 358,146 353,151 355,158 348,153 342,158 344,151 339,146 346,145" fill="url(#goldGrad)"/>

    <!-- AI Star Sparkle (Intelligence & Guidance) -->
    <path d="M 170 125 Q 170 150 150 155 Q 170 160 170 185 Q 170 160 190 155 Q 170 150 170 125 Z" fill="#ffffff"/>
    <circle cx="205" cy="130" r="4" fill="#ffffff"/>

    <!-- Dynamic Check Badge (Achievements & Habits) -->
    <circle cx="355" cy="340" r="38" fill="#10b981" stroke="#070b14" stroke-width="6"/>
    <path d="M 342 340 L 352 350 L 370 332" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
